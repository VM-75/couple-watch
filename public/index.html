<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Watch - Смотрите вместе</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Стартовая страница -->
    <div id="landingPage">
        <div class="logo">🍿</div>
        <h1>Couple Watch</h1>
        <p class="subtitle">Смотрите фильмы вместе онлайн</p>
        
        <button id="createRoom">Создать комнату</button>
        
        <div class="divider">или</div>
        
        <input type="text" id="roomCode" placeholder="Введите код комнаты" maxlength="6">
        <button id="joinRoom">Присоединиться</button>
    </div>

    <!-- Контейнер с видео -->
    <div id="videoContainer">
        <div id="status">Подключение...</div>
        <div id="roomCodeDisplay"></div>
        
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        
        <div class="controls">
            <button id="shareScreen">🖥️ Показать экран</button>
            <button id="stopShare">⏹️ Остановить показ</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
