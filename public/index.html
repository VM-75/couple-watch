<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Watch - Смотрите вместе</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Стартовая страница -->
    <div id="landingPage" class="landing-page">
        <div class="card">
            <div class="logo">🍿</div>
            <h1>Couple Watch</h1>
            <p class="subtitle">Смотрите фильмы вместе онлайн</p>
            
            <button id="createRoom" class="primary-btn">Создать комнату</button>
            
            <div class="divider">
                <span>или</span>
            </div>
            
            <input type="text" id="roomCode" placeholder="Введите код комнаты" class="input-field">
            <button id="joinRoom" class="secondary-btn">Присоединиться</button>
        </div>
    </div>

    <!-- Контейнер видео -->
    <div id="videoContainer" class="video-container" style="display: none;">
        <div class="room-info">
            <div id="roomCodeDisplay" class="room-code"></div>
            <div id="status" class="status">Готово к подключению</div>
        </div>

        <div class="videos">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">Вы</div>
            </div>
            
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Партнёр</div>
            </div>
        </div>

        <div class="controls">
            <button id="shareScreen" class="control-btn">🖥️ Показать экран</button>
            <button id="stopShare" class="control-btn" style="display: none;">⏹️ Остановить показ</button>
        </div>
    </div>

    <!-- Подключаем Socket.IO ПЕРВЫМ -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Потом наш код -->
    <script src="app.js"></script>
</body>
</html>
